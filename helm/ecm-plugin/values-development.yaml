# Development values for ecm-plugin
# This file contains development-friendly configurations

replicaCount: 1

image:
  repository: pdasilva1/ecm-k8s-plugin
  pullPolicy: Always
  tag: "latest"

podAnnotations:
  prometheus.io/scrape: "false"

service:
  type: NodePort
  port: 80
  targetPort: 8080

ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

networkPolicy:
  enabled: false

rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["get", "list"]
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "list"]

app:
  environment: Development
  aspnetcoreUrls: "http://+:8080"

  vault:
    baseUrl: "http://vault.vault.svc.cluster.local:8200"
    secretsEngine: "secret"

  logging:
    logLevel:
      default: "Debug"
      microsoft: "Information"
      microsoftAspNetCore: "Debug"

probes:
  startup:
    enabled: true
    httpGet:
      path: /api/credentials/health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 3
    timeoutSeconds: 2
    failureThreshold: 10

  liveness:
    enabled: true
    httpGet:
      path: /api/credentials/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 5

  readiness:
    enabled: true
    httpGet:
      path: /api/credentials/health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3

strategy:
  type: Recreate

# Development credentials (not for production!)
secrets:
  vaultUsername: "dev-vault-user"
  vaultPassword: "dev-password-change-me"
