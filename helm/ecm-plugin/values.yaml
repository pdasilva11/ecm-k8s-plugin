# Default values for ecm-plugin
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: pdasilva1/ecm-k8s-plugin
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "vault-credential-service"

serviceAccount:
  create: true
  annotations: {}
  name: "vault-credential-service"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/rate-limit: "100"
  hosts:
    - host: vault-credentials.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: vault-service-tls
      hosts:
        - vault-credentials.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Network Policy
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            name: default
      ports:
      - protocol: TCP
        port: 8080
  egress:
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 8200  # Vault port
    - to:
      - namespaceSelector: {}
      ports:
      - protocol: TCP
        port: 443   # HTTPS
      - protocol: TCP
        port: 53    # DNS
      - protocol: UDP
        port: 53

# RBAC configuration
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["secrets"]
      verbs: ["get", "list"]
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get", "list"]

# Application configuration
app:
  environment: Production
  aspnetcoreUrls: "http://+:8080"

  # PRA/ECM Configuration (BeyondTrust Privileged Remote Access)
  ecm:
    sraSiteHostname: "pra.example.com"
    sraClientId: "your-pra-client-id"
    # SRA Client Secret should be set in secrets section below

  # Vault configuration
  vault:
    baseUrl: "http://vault.vault.svc.cluster.local:8200"
    secretsEngine: "secret"
    # Username and password should be set in secrets

  # Logging configuration
  logging:
    logLevel:
      default: "Information"
      microsoft: "Warning"
      microsoftAspNetCore: "Information"

# Probes configuration
probes:
  startup:
    enabled: true
    httpGet:
      path: /api/credentials/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 10

  liveness:
    enabled: true
    httpGet:
      path: /api/credentials/health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  readiness:
    enabled: true
    httpGet:
      path: /api/credentials/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 2

# Pod affinity/anti-affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - vault-credential-service
          topologyKey: kubernetes.io/hostname

nodeSelector: {}

tolerations: []

# Strategy for deployment updates
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ConfigMap data
configMap:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft": "Warning",
          "Microsoft.AspNetCore": "Information"
        }
      },
      "AllowedHosts": "*"
    }

# Secret data (base64 encoded or stringData)
# IMPORTANT: Replace these values with your actual credentials
secrets:
  # HashiCorp Vault credentials
  vaultUsername: "vault-user"
  vaultPassword: "change-me-to-your-vault-password"

  # BeyondTrust PRA/SRA credentials
  sraClientSecret: "change-me-to-your-pra-client-secret"
