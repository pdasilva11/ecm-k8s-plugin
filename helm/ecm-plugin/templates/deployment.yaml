apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecm-plugin.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ecm-plugin.labels" . | nindent 4 }}
    version: v1
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "ecm-plugin.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "ecm-plugin.selectorLabels" . | nindent 8 }}
        version: v1
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ecm-plugin.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: vault-service
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        # BeyondTrust ECM Service Configuration
        - name: ECMConfig__SRASiteHostname
          value: {{ .Values.app.ecm.sraSiteHostname | quote }}
        - name: ECMConfig__SRAClientId
          value: {{ .Values.app.ecm.sraClientId | quote }}
        - name: ECMConfig__SRAClientSecret
          valueFrom:
            secretKeyRef:
              name: {{ include "ecm-plugin.fullname" . }}-credentials
              key: sra-client-secret
        # HashiCorp Vault Plugin Configuration
        - name: VaultPluginConfig__VaultBaseUrl
          value: {{ .Values.app.vault.baseUrl | quote }}
        - name: VaultPluginConfig__VaultUsername
          valueFrom:
            secretKeyRef:
              name: {{ include "ecm-plugin.fullname" . }}-credentials
              key: vault-username
        - name: VaultPluginConfig__VaultPassword
          valueFrom:
            secretKeyRef:
              name: {{ include "ecm-plugin.fullname" . }}-credentials
              key: vault-password
        - name: VaultPluginConfig__VaultSecretsEngine
          value: {{ .Values.app.vault.secretsEngine | quote }}
        # Logging
        - name: Logging__LogLevel__Default
          value: {{ .Values.app.logging.logLevel.default | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: {{ include "ecm-plugin.fullname" . }}-config
      - name: tmp
        emptyDir: {}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
