apiVersion: v1
kind: Service
metadata:
  name: vault-credential-service
  namespace: vault-services
  labels:
    app: vault-credential-service
  annotations:
    description: "Service for Vault Credential Injection API"
spec:
  type: ClusterIP
  selector:
    app: vault-credential-service
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
