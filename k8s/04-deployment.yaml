apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-credential-service
  namespace: vault-services
  labels:
    app: vault-credential-service
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: vault-credential-service
  template:
    metadata:
      labels:
        app: vault-credential-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vault-credential-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: vault-service
        image: pdasilva1/ecm-k8s-plugin:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        # Environment Variables
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"

        # Vault Configuration
        - name: VaultConfig__BaseUrl
          value: "http://vault.vault.svc.cluster.local:8200"
        - name: VaultConfig__Username
          valueFrom:
            secretKeyRef:
              name: vault-credentials
              key: vault-username
        - name: VaultConfig__Password
          valueFrom:
            secretKeyRef:
              name: vault-credentials
              key: vault-password
        - name: VaultConfig__SecretsEngine
          value: "secret"

        # Logging
        - name: Logging__LogLevel__Default
          value: "Information"

        # Resource Requests and Limits
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Startup Probe
        startupProbe:
          httpGet:
            path: /api/credentials/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10

        # Liveness Probe
        livenessProbe:
          httpGet:
            path: /api/credentials/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        # Readiness Probe
        readinessProbe:
          httpGet:
            path: /api/credentials/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2

        # Volume Mounts
        volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
        - name: tmp
          mountPath: /tmp

      # Volumes
      volumes:
      - name: config
        configMap:
          name: vault-service-config
      - name: tmp
        emptyDir: {}

      # Pod Disruption Budget
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - vault-credential-service
              topologyKey: kubernetes.io/hostname
